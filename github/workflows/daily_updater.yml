name: Atualizador Diário de Notícias

on:
  schedule:
    # Roda todos os dias às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite rodar o script manualmente no GitHub

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checando o Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar Motor de IA Diário
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend_engine/daily_updater.py

      - name: Fazer Commit e Push das Alterações
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add news_data.json backend_engine/weekly_news_storage.json
          git commit -m "Automação: Atualização Diária de Notícias [skip ci]" || echo "Nenhuma alteração para commitar"
          git push
