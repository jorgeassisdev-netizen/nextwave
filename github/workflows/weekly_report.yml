name: Gerador de Relatório Semanal

on:
  schedule:
    # Roda todos os domingos às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite rodar manualmente no painel Actions

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checando o Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar Relatório IA e Arquivar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend_engine/weekly_report_generator.py

      - name: Fazer Commit e Push das Alterações
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add weekly_report.json backend_engine/weekly_news_storage.json reports_archive/
          git commit -m "Automação: Relatório Semanal Gerado [skip ci]" || echo "Nenhuma alteração para commitar"
          git push
