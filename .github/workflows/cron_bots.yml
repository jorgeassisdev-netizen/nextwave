name: NextWave Cron Bots

on:
  schedule:
    # 03:00 UTC == 00:00 Horário de Brasília (BRT)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  run-ai-bots:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para o bot poder fazer commit no repositório

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Motor de IA (Cron Runner)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend_engine/cron_runner.py

      - name: Commit e Push dos Arquivos JSON (Se houver mudanças)
        run: |
          git config --global user.name 'NextWave AI Bot'
          git config --global user.email 'bot@nextwave.com'
          git add www/news_data.json www/weekly_report.json www/weekly_news_storage.json www/reports_archive/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Inteligência Diária/Semanal gerada" && git push)
